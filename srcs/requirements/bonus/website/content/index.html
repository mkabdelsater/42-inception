<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inception Project Documentation</title>
    <!-- GitHub-style Markdown CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }

        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }
        body {
            background-color: #f6f8fa;
        }
    </style>
</head>
<body class="markdown-body">
    <div id="content">Loading documentation...</div>

    <!-- Marked.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        async function renderMarkdown() {
            try {
                const response = await fetch('README.md');
                if (!response.ok) throw new Error('Failed to load README.md');
                const text = await response.text();
                document.getElementById('content').innerHTML = marked.parse(text);
            } catch (error) {
                document.getElementById('content').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        renderMarkdown();
    </script>
</body>
</html>
